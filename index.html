<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OzyLand Games</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #1b1f3a, #2a315a);
            color: white;
            text-align: center;
        }

        header {
            padding: 60px 20px;
            animation: fadeIn 1.5s ease;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            letter-spacing: 2px;
            animation: glow 2s infinite alternate;
        }

        p {
            font-size: 20px;
            opacity: 0.85;
        }

        .card {
            margin: 40px auto;
            padding: 25px;
            background: rgba(255, 255, 255, 0.08);
            width: 90%;
            max-width: 600px;
            border-radius: 16px;
            backdrop-filter: blur(6px);
            animation: fadeInUp 1.2s ease;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            font-size: 14px;
            opacity: 0.6;
        }

        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }

        @keyframes fadeInUp {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #7ab6ff;
            }
            to {
                text-shadow: 0 0 20px #b4d7ff;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>OzyLand Games</h1>
        <p>Mobil oyun dünyasına hoş geldiniz!</p>
    </header>

    <div class="card">
        <h2>Hakkımızda</h2>
        <p>OzyLand Games, eğlenceli ve yenilikçi mobil oyunlar geliştiren bağımsız bir oyun stüdyosudur.</p>
    </div>

    <div class="card">
        <h2>Oyunlarımız</h2>
        <p>Yeni oyunlarımız çok yakında Google Play Store’da!</p>
    </div>

    <footer>
        © 2025 OzyLand Games — Tüm hakları saklıdır.
    </footer>

</body>
</html>
